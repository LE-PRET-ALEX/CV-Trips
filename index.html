<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/4d5733abbf.js" crossorigin="anonymous"></script>
    <title>CV-TRIPS</title>
</head>
<body>

    <!-- SECTION COM VIDEO (NAV + HERO) -->
    <section class="top-section">

        <video autoplay muted loop playsinline class="background-video">
            <source src="resources/videos/banner_bg_video.mp4" type="video/mp4">
        </video>

        <header>
            <nav class="nav_bar">
                <div class="header_logo">
                    <img src="resources/logos/newlogonobg.png" alt="Logo CV Trips">
                    <span>CV TRIPS</span>
                </div>

                <div class="menu">
                    <ul>
                        <li class="link-holder"><a href="#"><i class="fa-solid fa-location-dot"></i> destinations</a></li>
                        <li class="link-holder"><a href="#"><i class="fa-solid fa-map"></i> map</a></li>
                        <li class="link-holder"><a href="#"><i id="plan_trip" class="fa-solid fa-plane"></i> plan trip</a></li>
                    </ul>
                </div>

                <div class="settings_bar">
                    <div class="lang_picker">
                        <img src="resources/logos/Flag_of_the_United_States.svg" alt="US Flag" id="flag_US">
                    </div>
                    <div class="account_search_submenu">
                        <i class="fa-solid fa-magnifying-glass" id="search_icon"></i>
                        <input type="text" id="search_bar" placeholder=" Type search here ...">
                        <i class="fa-solid fa-user" id="account_icon"></i>
                    </div>
                </div>
            </nav>
        </header>

        <div class="hero">
            <div class="hero-content">
                <h1>welcome to cabo verde</h1>
                <p>the paradisiac country in the atlantic</p>
                <a href="#main" class="btn">Explore</a>
            </div>
        </div>

        <div class="open_in_maps">
            <a href="#">| open in maps |</a>
        </div>
    </section>

    <!-- RESTO DO SITE -->
    <main id="main">
        <section class="content">
            <div class="go_to_cv">
                <div class="go_to_cv_title">
                    <h2>I want to go to Cabo Verde</h2>
                </div>
                <ul type= "none" class="utilities">
                    <li class="utility">
                        <i class="fa-solid fa-passport" href="#"></i>
                        <a href="#">Needed Documents</a>
                    </li>
                    <li class="utility">
                        <i class="fa-solid fa-bus"></i>
                        <a href="#">Transportation</a>
                    </li>
                    <li class="utility">
                        <i class="fa-solid fa-bed"></i>
                        <a href="#">Accommodations</a>
                    </li>
                    <li class="utility">
                        <i class="fa-solid fa-utensils"></i>
                        <a href="#">Food</a>
                    </li>
                    <li class="utility">
                        <i class="fa-solid fa-cart-shopping"></i>
                        <a href="#">Shopping</a>
                    </li>
                </ul>
            </div>
        </section>
    </main>

</body>
</html>
